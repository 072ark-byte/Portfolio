
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Website</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      text-align: center;
      color: #172033;
      background: linear-gradient(135deg, #dbeafe, #f5f3ff);
    }
    main {
      max-width: 500px;
      margin: 24px;
      padding: 40px 28px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 35px #17203318;
    }
    h1 { color: #2563eb; }
    p { line-height: 1.7; color: #475569; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 20px;
      border-radius: 10px;
      color: white;
      background: #2563eb;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Welcome to My Website!</h1>
    <p>This is my first website, published for free
       using GitHub Pages.</p>
    <a href="https://github.com/">Explore GitHub</a>
  </main>
</body>
</html>
